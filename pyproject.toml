[project]
name = "lawbey-mcp"
version = "0.1.0"
description = "LawBey MCP server — exposes Bahamian legal RAG (Open WebUI) as an MCP tool for Carta"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "LawBey / Kemis Group" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "mcp>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
